<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic To-Do List | JavaScript & DOM</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">Experiment 3: Dynamic To-Do List</a>
            <a href="../index.html" class="btn btn-outline-light btn-sm">← Back to Hub</a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-success text-white py-3">
                        <h4 class="mb-0 text-center">My Task Manager</h4>
                    </div>
                    <div class="card-body p-4">
                        <!-- Input Form -->
                        <form id="todoForm" class="row g-2 mb-4">
                            <div class="col-8 col-sm-9">
                                <label for="taskInput" class="visually-hidden">New Task</label>
                                <input type="text" id="taskInput" class="form-control" placeholder="Enter a new task..." required autocomplete="off">
                            </div>
                            <div class="col-4 col-sm-3">
                                <button type="submit" class="btn btn-success w-100">Add Task</button>
                            </div>
                        </form>

                        <!-- Task Filters & Stats -->
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="text-muted small" id="taskCounter">0 tasks remaining</span>
                            <button id="clearCompletedBtn" class="btn btn-sm btn-outline-secondary">Clear Completed</button>
                        </div>

                        <!-- Task List -->
                        <ul id="taskList" class="list-group">
                            <!-- Tasks will be dynamically rendered here -->
                        </ul>

                        <div id="emptyMessage" class="text-center text-muted py-4">
                            <p class="mb-0">No tasks yet! Add a task above to get started.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
